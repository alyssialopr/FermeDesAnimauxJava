spring:
  application:
    name: ferme-des-animaux

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ferme}
    username: ${SPRING_DATASOURCE_USERNAME:ferme}
    password: ${SPRING_DATASOURCE_PASSWORD:ferme}
    hikari:
      pool-name: ferme-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Le schema est la propriete de Flyway, Hibernate se contente de le verifier.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

ferme:
  # Jeu de donnees de demonstration (les animaux et eleveurs de l'ancien Main.java).
  donnees-demo: ${FERME_DONNEES_DEMO:true}

logging:
  level:
    laFerme: INFO

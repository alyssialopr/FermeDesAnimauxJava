spring:
  application:
    name: ferme-des-animaux

  autoconfigure:
    exclude:
      # L'API n'a pas d'utilisateur par defaut : l'authentification passe
      # uniquement par la cle d'eleveur. Sans cette exclusion, Spring Boot
      # creerait un compte "user" et afficherait son mot de passe au demarrage.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: false

  datasource:
    # Aucun identifiant en dur dans le depot : voir .env.example et docker-compose.yml.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ferme}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: ferme-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Le schema est la propriete de Flyway, Hibernate se contente de le verifier.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # L'API est derriere nginx : on lui fait confiance pour l'adresse d'origine.
  forward-headers-strategy: framework
  error:
    # Les messages d'erreur exploitables sont produits par GestionnaireErreurs :
    # la page d'erreur par defaut ne divulgue ni message interne ni stacktrace.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  # Bornes anti-abus : une requete de la ferme tient largement dans ces limites.
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    connection-timeout: 5s
    threads:
      max: 100

management:
  endpoints:
    web:
      exposure:
        # Strict minimum : de quoi repondre a docker compose, rien de plus.
        # /actuator n'est d'ailleurs pas relaye par nginx.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  info:
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    # Les operations sont visibles d'entree : replier les tags donnait une page
    # apparemment vide.
    doc-expansion: list
    display-operation-id: false
    persist-authorization: true
    filter: true
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

ferme:
  # Jeu de donnees de demonstration (les animaux et eleveurs de l'ancien Main.java).
  donnees-demo: ${FERME_DONNEES_DEMO:true}

logging:
  level:
    laFerme: INFO

spring:
  application:
    name: ferme-des-animaux

  datasource:
    # Aucun identifiant en dur dans le depot : voir .env.example et docker-compose.yml.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ferme}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: ferme-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Le schema est la propriete de Flyway, Hibernate se contente de le verifier.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    # Les messages d'erreur exploitables sont produits par GestionnaireErreurs :
    # la page d'erreur par defaut ne divulgue ni message interne ni stacktrace.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

ferme:
  # Jeu de donnees de demonstration (les animaux et eleveurs de l'ancien Main.java).
  donnees-demo: ${FERME_DONNEES_DEMO:true}

logging:
  level:
    laFerme: INFO

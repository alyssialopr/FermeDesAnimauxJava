name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Les tests d'integration demarrent un PostgreSQL via Testcontainers :
      # le runner ubuntu-latest fournit deja Docker.
      - name: Compiler et tester
        run: ./mvnw -B -ntp verify

      - name: Construire l'image Docker
        run: docker build -t ferme-des-animaux:${{ github.sha }} .

  front:
    name: Build du jeu (Three.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installer les dependances
        working-directory: front
        run: npm ci

      - name: Construire le bundle
        working-directory: front
        run: npm run build

      - name: Construire l'image Docker du front
        run: docker build -t ferme-des-animaux-web:${{ github.sha }} ./front

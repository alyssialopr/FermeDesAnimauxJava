# Limitation de debit : 20 requetes par seconde et par IP sur l'API, avec une
# reserve pour les rafales normales du jeu (rafraichissement + action).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=connexions:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les redirections restent relatives : sinon nginx renvoie http://localhost/
    # sans le port publie par docker.
    absolute_redirect off;

    # On n'annonce pas la version du serveur.
    server_tokens off;

    # Rien a televerser ici : une requete de jeu tient dans quelques kilo-octets.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn connexions 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-tetes de securite, appliques a toutes les reponses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Le jeu est entierement servi depuis cette origine : aucun script, style ou
    # appel externe n'est autorise.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Resolveur DNS interne de Docker : l'adresse de l'API est resolue a chaque
    # requete, le front demarre donc meme si l'API n'est pas encore prete.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Le front et l'API sont servis sur la meme origine : pas de CORS a gerer.
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        set $api http://api:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_hide_header X-Powered-By;
    }

    # Documentation de l'API. L'actuator, lui, n'est volontairement plus relaye :
    # il n'a rien a faire sur le port public.
    location ~ ^/(swagger-ui|v3/api-docs) {
        limit_req zone=api burst=20 nodelay;

        set $api http://api:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Documentation hors-ligne (docs/api.html monte par docker compose) :
    # http://localhost:3000/doc
    location = /doc {
        return 302 /doc/;
    }

    location /doc/ {
        alias /usr/share/nginx/doc/;
        index api.html;
        # Swagger UI embarque ses scripts et styles en ligne : la politique y est
        # assouplie, mais uniquement pour cette page.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'" always;
        # Pas de repli sur la doc : un chemin inconnu doit repondre 404 plutot
        # que de renvoyer la page avec un code 200 trompeur.
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers caches ne sont pas servis.
    location ~ /\. {
        deny all;
    }
}

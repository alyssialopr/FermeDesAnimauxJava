server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les redirections restent relatives : sinon nginx renvoie http://localhost/
    # sans le port publie par docker.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolveur DNS interne de Docker : l'adresse de l'API est resolue a chaque
    # requete, le front demarre donc meme si l'API n'est pas encore prete.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Le front et l'API sont servis sur la meme origine : pas de CORS a gerer.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Documentation de l'API accessible depuis le meme hote que le jeu.
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        set $api http://api:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Documentation hors-ligne (docs/api.html monte par docker compose) :
    # http://localhost:3000/doc
    location = /doc {
        return 302 /doc/;
    }

    location /doc/ {
        alias /usr/share/nginx/doc/;
        index api.html;
        try_files $uri $uri/ /doc/api.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
